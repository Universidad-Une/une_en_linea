# Preview: incluir dentro del bloque server de preview.une-enlinea.com.
# El puerto debe coincidir con API_PORT del .env de /var/www/preview_une_en_linea.
location = /api/forms/inscripcion {
    proxy_pass http://127.0.0.1:4323;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 40s;
    proxy_cache off;
}
